version: "3.9"

services:
  db:
    image: postgres:15
    container_name: vision_vogue_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vision_vogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vision_vogue"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

